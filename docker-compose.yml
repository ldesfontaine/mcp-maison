services:
  mcp:
    # Image publiée par .github/workflows/release.yml (amd64, arm64). Épingler aussi par digest, que la
    # balise ne puisse pas changer sous vos pieds : image: ghcr.io/ldesfontaine/mcp-maison:v0.1.0@sha256:<digest>
    # (digest : page du paquet sur GitHub, ou `docker buildx imagetools inspect ghcr.io/ldesfontaine/mcp-maison:v0.1.0`).
    # Construire depuis les sources (dev) : docs/deploiement.md.
    image: ghcr.io/ldesfontaine/mcp-maison:v0.1.0
    container_name: mcp-maison
    restart: unless-stopped
    env_file: .env
    environment:
      # Prioritaire sur .env : jamais de jetons de développement dans ce conteneur.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/mcp-maison.db
      AUDIT_LOG_PATH: /app/data/audit.jsonl
    volumes:
      # Base SQLite (sessions OAuth) + journal d'audit. Inscriptible par l'uid 1000 (user "node").
      - ./data:/app/data
      # Droits (optionnel) : le DOSSIER, pas le fichier seul, sinon une modification (nouvel inode)
      # ne serait pas vue par le conteneur. Décommenter et régler PERMISSIONS_FILE=/app/config/permissions.yaml.
      # - ./config:/app/config:ro
    # Exposé en local uniquement : un reverse proxy HTTPS (Traefik, Caddy, Nginx) se met devant.
    ports:
      - "127.0.0.1:3000:3000"
