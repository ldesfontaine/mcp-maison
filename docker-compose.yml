services:
  mcp:
    build: .
    container_name: mcp-maison
    restart: unless-stopped
    env_file: .env
    environment:
      # Prioritaire sur .env : jamais de jetons de développement dans ce conteneur.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/mcp-maison.db
      AUDIT_LOG_PATH: /app/data/audit.jsonl
    volumes:
      # Base SQLite (sessions OAuth) + journal d'audit. Inscriptible par l'uid 1000 (user "node").
      - ./data:/app/data
      # Droits par personne (optionnel). Décommenter et régler PERMISSIONS_FILE=/app/permissions.yaml.
      # - ./permissions.yaml:/app/permissions.yaml:ro
    # Exposé en local uniquement : un reverse proxy HTTPS (Traefik, Caddy, Nginx) se met devant.
    ports:
      - "127.0.0.1:3000:3000"
