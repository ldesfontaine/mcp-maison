# Droits par personne et par groupe. Copier en permissions.yaml (ou pointer PERMISSIONS_FILE dessus).
# Sans fichier : droits minimaux pour tous (core:ping, core:whoami), rien d'autre.
# Permission = "groupe:action". "*" = tout ; "gitlab:*" = toutes les actions du groupe gitlab.
# Les droits s'additionnent : everyone + users.<id> + groups.<groupe> de chaque groupe de la personne.

everyone:            # toute personne connectée
  - core:ping        # ping
  - core:whoami      # whoami : identité, permissions effectives, outils permis

users:               # par identifiant (preferred_username OIDC, ou id de AUTH_DEV_TOKENS)
  lucas: ["*"]

groups:              # par groupe de l'IdP (chemin complet GitLab, ex. "exemple/dev")
  exemple/dev:
    - gitlab:*       # gitlab_publish, gitlab_list_publications
  exemple/lecture:
    - gitlab:read
    - core:audit     # audit_recent et GET /audit
